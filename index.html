<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <!-- Content-Security-Policy (defence in depth: no third-party origin, no inline script, no eval).
         'wasm-unsafe-eval' = WebAssembly compilation only (WASM SIMD SIFT). style 'unsafe-inline': the
         Vite dev server injects CSS as <style> elements (the build uses the stylesheet + CSSOM only).
         blob: = object URLs (thumbnails, downloads). Workers (same-origin scripts) and WebGPU are not
         restricted by it; connect-src 'self' also covers the dev server's HMR WebSocket.
         frame-ancestors needs an HTTP header (not available on static hosts such as GitHub Pages). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob: mediastream:; connect-src 'self'; worker-src 'self'; font-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <!-- viewport-fit=cover: draw under the notch / home indicator (env(safe-area-inset-*)). Inputs use
         ≥ 16 px text, so iOS never zooms into them; pinch-zoom stays available for accessibility. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0b0f" />
    <meta name="description" content="On-device photogrammetry: capture objects and places continuously and reconstruct them in 3D on your phone." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="3D Scan" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <title>3D Scan</title>
  </head>
  <body>
    <div id="app"></div>
    <noscript>3D Scan needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
